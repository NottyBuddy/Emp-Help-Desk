<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in | IndiFrame Agent Centre</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.login-wrap{width:min(440px,100%)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-panel{padding:32px;border:1px solid #2b4059;border-radius:22px;background:linear-gradient(145deg,#15243a,#0d1726);box-shadow:0 30px 90px #0007}.login-panel h1{font:600 25px 'Space Grotesk';margin:0 0 8px}.login-panel p{color:#9eafc4;line-height:1.6;font-size:12px;margin:0 0 22px}.login-panel input,.login-panel button{width:100%;height:46px;margin-top:10px}.login-panel input{background:#0a1422;border:1px solid #30435b;color:white;border-radius:10px;padding:0 13px}.login-panel button{border:0;border-radius:10px;background:linear-gradient(100deg,#6fe4d8,#8eaaff);color:#071321;font-weight:700;cursor:pointer}.login-panel button.alt{background:transparent;border:1px solid #35465d;color:#b9c8dc}.msg{min-height:20px;margin-top:13px!important;color:#a6eee2!important}.msg.err{color:#ff9da2!important}.login-foot{text-align:center;color:#6e8199;font-size:9px;letter-spacing:1px;margin-top:17px}</style></head><body><div class="login-wrap"><div class="login-brand"><div class="brand-mark">IF</div><div><b style="font:700 14px 'Space Grotesk';letter-spacing:1.8px">INDIFRAME</b><small style="display:block;color:#8c9ab0;font-size:8px;letter-spacing:1.6px;margin-top:4px">AGENT COMMAND CENTRE</small></div></div><div class="login-panel"><h1 id="title">Welcome back.</h1><p id="sub">Sign in with your work email. We'll send a one-time verification code. No password required.</p><form id="form"><input id="email" type="email" autocomplete="username webauthn" placeholder="Work email address" required><input id="code" hidden inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit verification code"><button id="submit">Continue with email</button><button class="alt" id="back" type="button" hidden>Use a different email</button></form><div id="passkey" hidden><p>Add a passkey to sign in next time using your fingerprint, face or device screen lock.</p><button id="add">Add a passkey</button><button class="alt" id="skip">Not now</button></div><p class="msg" id="msg" role="status"></p></div><div class="login-foot">SECURE AGENT ACCESS · INTERNAL WORKSPACE</div></div><script>(function(){const A=window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg'),pass=document.getElementById('passkey');let step=0,has=false;const next=()=>{let n=new URLSearchParams(location.search).get('next')||'/';location.replace(n[0]==='/'&&n[1]!=='/'&&!n.includes('\\')?n:'/');};const say=(s,err=false)=>{msg.textContent=s;msg.className='msg'+(err?' err':'')};const declined=()=>{try{return localStorage.getItem('if_passkey_skip')==='1'}catch(e){return false}};const finish=()=>{if(has||declined()||!A.supportsPasskeys()){next();return}form.hidden=true;document.getElementById('title').textContent='You’re signed in';document.getElementById('sub').textContent='Make future sign-ins faster with a device passkey.';pass.hidden=false};A.getSession().then(s=>{if(s&&s.user)next()}).catch(()=>{});back.onclick=()=>{step=0;email.hidden=false;code.hidden=true;back.hidden=true;submit.textContent='Continue with email';say('')};form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(step===0){const r=await A.startLogin({email:email.value.trim()});has=!!r.has_passkey;if(has&&A.supportsPasskeys()){try{await A.signInWithPasskey({email:email.value.trim()});next();return}catch(err){}}step=1;email.hidden=true;code.hidden=false;back.hidden=false;submit.textContent='Verify and sign in';say('Verification code sent. Check your inbox.');code.focus()}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});finish()}}catch(err){say(err.message||'Unable to sign in. Please try again.',true)}finally{submit.disabled=false}};document.getElementById('add').onclick=async()=>{try{await A.registerPasskey();next()}catch(e){say(e.message||'Passkey could not be saved.',true)}};document.getElementById('skip').onclick=()=>{try{localStorage.setItem('if_passkey_skip','1')}catch(e){}next()};email.focus()})();</script></body></html>
