name: Inspect Production D1 (Read Only)

on:
  push:
    branches:
      - main
    paths:
      - "tools/cloudflare-d1-mcp/inspect-production-d1.mjs"
      - ".github/workflows/inspect-production-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indiframe-production-d1-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inspect production schema, row counts and foreign keys (read only)
        run: node tools/cloudflare-d1-mcp/inspect-production-d1.mjs > production-d1-inspection.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish inspection report
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-inspection
          path: production-d1-inspection.json
          if-no-files-found: error
          retention-days: 7

      - name: Add safe summary
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("production-d1-inspection.json", "utf8"));
            const rows = report.tables.map(t => "| " + t.name + " | " + t.rowCount + " |").join("\n");
            const summary = [
              "## Production D1 inspection (read only)",
              "",
              "- Database: `" + report.databaseName + "`",
              "- Database ID: `" + report.databaseId + "`",
              "- Preview database touched: **No**",
              "- Schema objects: " + report.tables.length + " tables, " + report.schemaObjects.length + " views",
              "",
              "| Table | Rows |",
              "|---|---:|",
              rows
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          '
