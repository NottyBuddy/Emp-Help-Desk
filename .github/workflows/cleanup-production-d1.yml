name: Clear Legacy Production D1 Data

on:
  push:
    branches:
      - main
    paths:
      - "tools/cloudflare-d1-mcp/cleanup-production-d1.mjs"
      - ".github/workflows/cleanup-production-d1.yml"

permissions:
  contents: read

concurrency:
  group: indiframe-production-d1-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record production recovery bookmark immediately before cleanup
        run: npx --yes wrangler@4 d1 time-travel info indiframe-helpdesk-db --config wrangler.toml > production-d1-precleanup-recovery.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run guarded production cleanup and verify every table
        run: node tools/cloudflare-d1-mcp/cleanup-production-d1.mjs > production-d1-cleanup-report.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish cleanup report and recovery bookmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-cleanup
          path: |
            production-d1-precleanup-recovery.txt
            production-d1-cleanup-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Add cleanup summary
        if: success()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("production-d1-cleanup-report.json", "utf8"));
            const summary = [
              "## Production D1 cleanup verified",
              "",
              "- Database: `" + report.databaseName + "`",
              "- Database ID: `" + report.databaseId + "`",
              "- Preview database touched: **No**",
              "- Tables cleared: " + report.tablesCleared.length,
              "- Rows cleared: **" + report.totalRowsCleared + "**",
              "- Rows remaining in targeted tables: **0**",
              "- Schema preserved: **Yes**"
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          '
