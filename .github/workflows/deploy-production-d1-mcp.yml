name: Deploy Production D1 MCP Worker

on:
  push:
    branches:
      - main
    paths:
      - "tools/cloudflare-d1-mcp/remote-worker.mjs"
      - "wrangler.mcp.toml"
      - ".github/workflows/deploy-production-d1-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indiframe-production-d1-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test remote MCP Worker
        run: node tools/cloudflare-d1-mcp/remote-worker.test.mjs

      - name: Deploy isolated production D1 MCP Worker
        run: npx --yes wrangler@4 deploy --config wrangler.mcp.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
